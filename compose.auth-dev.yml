name: cps-auth-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: corporate_procurement_auth_dev
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for the isolated auth development database}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the isolated auth development database}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth-dev-data:
