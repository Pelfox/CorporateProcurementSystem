spring.application.name=cps-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/corporate_procurement_auth_dev}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

app.auth.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.auth.temporary-password-ttl=${TEMPORARY_PASSWORD_TTL:PT24H}

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.fail-on-unknown-properties=true
