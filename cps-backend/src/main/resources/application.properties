spring.application.name=cps-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/corporate_procurement_auth_dev}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

app.auth.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.auth.temporary-password-ttl=${TEMPORARY_PASSWORD_TTL:PT24H}
app.auth.tokens.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
app.auth.tokens.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
app.auth.tokens.issuer=${JWT_ISSUER:corporate-procurement-system}
app.auth.tokens.audience=${JWT_AUDIENCE:cps-web}
app.auth.tokens.access-ttl=${ACCESS_TOKEN_TTL:PT10M}
app.auth.tokens.password-change-ttl=${PASSWORD_CHANGE_TOKEN_TTL:PT5M}
app.auth.tokens.session-ttl=${AUTH_SESSION_TTL:P7D}
app.auth.tokens.history-retention=${AUTH_HISTORY_RETENTION:P1D}

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.fail-on-unknown-properties=true
